# Techno Viking colors for tmux

set -g pane-border-style "fg=#2A3438"
set -g pane-active-border-style "fg=#F12EAF"

set -g status-style "bg=#0B1012,fg=#E8E7E5"

set -g status-left "#[bg=#F12EAF,fg=#0B1012,bold] #S #[bg=#0B1012] "
set -g status-right "#[fg=#5A6469]#[fg=#FF5BC5,bold] %H:%M #[fg=#2A3438]| #[fg=#5CE0A8]%d-%b-%Y "

setw -g window-status-format "#[fg=#5A6469] #I:#W "
setw -g window-status-current-format "#[bg=#1C2326,fg=#F12EAF,bold] #I:#W "

set -g message-style "bg=#0B1012,fg=#F12EAF,bold"
set -g message-command-style "bg=#0B1012,fg=#FF5BC5"

setw -g mode-style "bg=#1C2326,fg=#E8E7E5"
