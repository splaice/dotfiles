# Catppuccin Mocha colors for tmux

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-right "#[fg=#6c7086]#[fg=#f5c2e7,bold] %H:%M #[fg=#45475a]| #[fg=#94e2d5]%d-%b-%Y "

setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I:#W "

set -g message-style "bg=#1e1e2e,fg=#89b4fa,bold"
set -g message-command-style "bg=#1e1e2e,fg=#f5c2e7"

setw -g mode-style "bg=#313244,fg=#cdd6f4"
