# ── Ember tmux config (SSH remote sessions) ──────────
# Loaded automatically when tmux detects an SSH session.
# Same layout/bindings as tmux.conf, red/orange color scheme.

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",ghostty:RGB"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history
set -g history-limit 10000

# Reduce escape delay (important for vim)
set -sg escape-time 10

# Focus events (for vim autoread)
set -g focus-events on

# ── Keybindings ───────────────────────────────────────

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + hjkl (vim-style)
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Jump to panes: 1=claude, 2=vim, 3=shell
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3

# Reload config
bind r source-file ~/.config/tmux/tmux-ember.conf \; display "Config reloaded"

# ── Ember Colors ────────────────────────────────────

# Pane borders
set -g pane-border-style "fg=#4a3830"
set -g pane-active-border-style "fg=#d47850"

# Status bar
set -g status-position bottom
set -g status-style "bg=#1c1210,fg=#d8c4b0"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#d47850,fg=#1c1210,bold] #S #[bg=#1c1210] "
set -g status-right "#[fg=#6a5848]#[fg=#c86878,bold] %H:%M #[fg=#4a3830]| #[fg=#e09860]%d-%b-%Y "

# Window tabs
setw -g window-status-format "#[fg=#6a5848] #I:#W "
setw -g window-status-current-format "#[bg=#3a2420,fg=#d47850,bold] #I:#W "

# Message style
set -g message-style "bg=#1c1210,fg=#d47850,bold"
set -g message-command-style "bg=#1c1210,fg=#c86878"

# Mode style (copy mode highlighting)
setw -g mode-style "bg=#3a2420,fg=#d8c4b0"
