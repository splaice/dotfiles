# ── tmux config (theme via .config/themes/current) ────

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",ghostty:RGB"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history
set -g history-limit 10000

# Reduce escape delay (important for nvim)
set -sg escape-time 10

# Focus events (for nvim autoread)
set -g focus-events on

# ── Keybindings ───────────────────────────────────────

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + hjkl (vim-style)
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Jump to panes: 1=claude, 2=nvim, 3=shell
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Theme (colors only; switched via the `theme` command) ──
source-file ~/.config/themes/current/tmux.conf

# Status bar layout (theme-independent)
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 60
