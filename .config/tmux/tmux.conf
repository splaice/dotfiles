# ── Tokyo Night tmux config ────────────────────────────

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",ghostty:RGB"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history
set -g history-limit 10000

# Reduce escape delay (important for vim)
set -sg escape-time 10

# Focus events (for vim autoread)
set -g focus-events on

# ── Keybindings ───────────────────────────────────────

# Prefix: Ctrl-a (easier than Ctrl-b)
#unbind C-b
#set -g prefix C-a
#bind C-b send-prefix

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with prefix + hjkl (vim-style)
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Jump to panes: 1=claude, 2=vim, 3=shell
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Tokyo Night Colors ────────────────────────────────

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Status bar
set -g status-position bottom
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26] "
set -g status-right "#[fg=#565f89]#[fg=#bb9af7,bold] %H:%M #[fg=#3b4261]| #[fg=#7dcfff]%d-%b-%Y "

# Window tabs
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#283457,fg=#7aa2f7,bold] #I:#W "

# Message style
set -g message-style "bg=#1a1b26,fg=#7aa2f7,bold"
set -g message-command-style "bg=#1a1b26,fg=#bb9af7"

# Mode style (copy mode highlighting)
setw -g mode-style "bg=#283457,fg=#c0caf5"
